<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>All Students - Brightwood Academy</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0a0e27;
            padding: 2rem;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .header-section h1 {
            color: white;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-section h1 i {
            color: #48dbfb;
        }

        .stats-badge {
            background: rgba(72, 219, 251, 0.1);
            padding: 10px 24px;
            border-radius: 40px;
            color: #48dbfb;
            border: 1px solid rgba(72, 219, 251, 0.2);
            font-weight: 600;
        }

        .table-wrapper {
            overflow-x: auto;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            padding: 0.5rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
        }

        thead {
            background: rgba(72, 219, 251, 0.1);
            border-bottom: 2px solid rgba(72, 219, 251, 0.2);
        }

        thead th {
            padding: 14px 16px;
            text-align: left;
            font-weight: 600;
            color: #48dbfb;
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        tbody tr {
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.2s ease;
        }

        tbody tr:hover {
            background: rgba(72, 219, 251, 0.05);
        }

        tbody td {
            padding: 12px 16px;
            color: rgba(255, 255, 255, 0.85);
        }

        .badge-grade {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            background: rgba(72, 219, 251, 0.1);
            color: #48dbfb;
            border: 1px solid rgba(72, 219, 251, 0.1);
        }

        .badge-gender {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-male {
            background: rgba(52, 152, 219, 0.2);
            color: #3498db;
            border: 1px solid rgba(52, 152, 219, 0.2);
        }

        .badge-female {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.2);
        }

        .badge-other {
            background: rgba(155, 89, 182, 0.2);
            color: #9b59b6;
            border: 1px solid rgba(155, 89, 182, 0.2);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .actions a {
            padding: 6px 12px;
            border-radius: 40px;
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-view {
            background: rgba(72, 219, 251, 0.1);
            color: #48dbfb;
            border: 1px solid rgba(72, 219, 251, 0.1);
        }

        .btn-view:hover {
            background: rgba(72, 219, 251, 0.2);
            transform: translateY(-2px);
        }

        .btn-edit {
            background: rgba(46, 204, 113, 0.1);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.1);
        }

        .btn-edit:hover {
            background: rgba(46, 204, 113, 0.2);
            transform: translateY(-2px);
        }

        .btn-delete {
            background: rgba(231, 76, 60, 0.1);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.1);
        }

        .btn-delete:hover {
            background: rgba(231, 76, 60, 0.2);
            transform: translateY(-2px);
        }

        .no-data {
            text-align: center;
            padding: 4rem 2rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .no-data i {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
            color: rgba(255, 255, 255, 0.1);
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            text-decoration: none;
            font-weight: 500;
            transition: 0.3s ease;
            margin-top: 1.5rem;
        }

        .back-btn:hover {
            background: rgba(72, 219, 251, 0.1);
            border-color: #48dbfb;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
            .container {
                padding: 1rem;
            }
            .header-section {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-section h1 {
                font-size: 1.5rem;
            }
            thead th, tbody td {
                padding: 8px 10px;
                font-size: 0.8rem;
            }
            .actions {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header-section">
        <h1>
            <i class="fas fa-users"></i>
            All Students
        </h1>
        <div class="stats-badge">
            <i class="fas fa-user-graduate"></i>
            Total: <span th:text="${totalStudents}">0</span> Students
        </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Roll No</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Date of Birth</th>
                <th>Gender</th>
                <th>Grade</th>
                <th>Section</th>
                <th>Admission Date</th>
                <th>Parent Name</th>
                <th>Relationship</th>
                <th>Parent Email ID</th>
                <th>Parent Phone</th>
                <th>Address</th>
                <th>Notes</th>
                <th>Joining Date</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${students}">
                <td><strong th:text="${student.rollNumber}"></strong></td>
                <td th:text="${student.firstName}"></td>
                <td th:text="${student.lastName}"></td>
                <td th:text="${student.dateOfBirth}"></td>
                <td>
                        <span class="badge-gender"
                              th:classappend="${student.gender == 'Male' ? 'badge-male' : student.gender == 'Female' ? 'badge-female' : 'badge-other'}"
                              th:text="${student.gender}">
                            Male
                        </span>
                </td>
                <td>
                    <span class="badge-grade" th:text="${student.grade}"></span>
                </td>
                <td th:text="${student.section}"></td>
                <td th:text="${student.admissionFormSubmitDate}"></td>
                <td th:text="${student.parentName}"></td>
                <td th:text="${student.relationShip}"></td>
                <td th:text="${student.parentEmailId}"></td>
                <td th:text="${student.parentPhone}"></td>
                <td th:text="${student.address}"></td>
                <td th:text="${student.notes}"></td>
                <td th:text="${student.joiningDate}"></td>
                <td>
                    <div class="actions">
                        <a href="#" class="btn-view" th:title="'View ' + ${student.firstName}">
                            <i class="fas fa-eye"></i>
                        </a>
                        <a th:href="'/admin/customize/student/update?studentRollNumber=' + ${student.rollNumber}"
                           class="btn-edit" th:title="'Edit ' + ${student.firstName}">
                            <i class="fas fa-edit"></i>
                        </a>
                    </div>
                </td>
            </tr>
            <tr th:if="${students.isEmpty()}">
                <td colspan="12">
                    <div class="no-data">
                        <i class="fas fa-user-graduate"></i>
                        <p>No students found in the system.</p>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Back Button -->
    <a href="/admin/home" class="back-btn">
        <i class="fas fa-arrow-left"></i>
        Back to Dashboard
    </a>
</div>

<script>
    // Add delete functionality
    document.querySelectorAll('.btn-delete').forEach(btn => {
        btn.addEventListener('click', function(e) {
            e.preventDefault();
            const rollNumber = this.closest('tr').querySelector('td strong').textContent;
            if (confirm('Are you sure you want to delete student with Roll Number: ' + rollNumber + '?')) {
                // You can implement AJAX delete here or submit a form
                window.location.href = '/admin/customize/student/delete?deleteStudent=' + rollNumber;
            }
        });
    });
</script>

</body>
</html>
