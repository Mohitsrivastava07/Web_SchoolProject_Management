<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Update Admission - Brightwood Academy</title>
  <!-- Font Awesome (free icons) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.5rem 1.5rem 3rem;
      position: relative;
      overflow-x: hidden;
      background: #0a0e27;
    }

    /* ===== ANIMATED BACKGROUND (same as dashboard) ===== */
    .bg-animation {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      background: linear-gradient(135deg, #0a0e27, #1a1a4e, #2d1b69);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: orbFloat 20s ease-in-out infinite;
    }
    .orb:nth-child(1) {
      width: 400px;
      height: 400px;
      background: rgba(13, 110, 253, 0.3);
      top: -100px;
      left: -100px;
      animation-delay: 0s;
    }
    .orb:nth-child(2) {
      width: 500px;
      height: 500px;
      background: rgba(102, 16, 242, 0.25);
      bottom: -150px;
      right: -150px;
      animation-delay: -5s;
    }
    .orb:nth-child(3) {
      width: 300px;
      height: 300px;
      background: rgba(255, 107, 107, 0.15);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes orbFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      25% { transform: translate(50px, -50px) scale(1.1); }
      50% { transform: translate(-30px, 30px) scale(0.9); }
      75% { transform: translate(30px, 50px) scale(1.05); }
    }

    .float-icon {
      position: absolute;
      color: rgba(255, 255, 255, 0.06);
      animation: floatIcon 25s linear infinite;
      text-shadow: 0 0 20px rgba(13, 110, 253, 0.1);
    }
    .float-icon:nth-child(4) { left: 5%; top: 10%; animation-duration: 28s; font-size: 4rem; animation-delay: 0s; }
    .float-icon:nth-child(5) { left: 15%; top: 60%; animation-duration: 22s; font-size: 3rem; animation-delay: 3s; }
    .float-icon:nth-child(6) { left: 25%; top: 30%; animation-duration: 30s; font-size: 5rem; animation-delay: 6s; }
    .float-icon:nth-child(7) { left: 35%; top: 75%; animation-duration: 24s; font-size: 3.5rem; animation-delay: 2s; }
    .float-icon:nth-child(8) { left: 45%; top: 15%; animation-duration: 26s; font-size: 4.5rem; animation-delay: 5s; }
    .float-icon:nth-child(9) { left: 55%; top: 55%; animation-duration: 23s; font-size: 3rem; animation-delay: 8s; }
    .float-icon:nth-child(10) { left: 65%; top: 25%; animation-duration: 29s; font-size: 4rem; animation-delay: 4s; }
    .float-icon:nth-child(11) { left: 75%; top: 70%; animation-duration: 25s; font-size: 3.5rem; animation-delay: 7s; }
    .float-icon:nth-child(12) { left: 85%; top: 40%; animation-duration: 27s; font-size: 4.5rem; animation-delay: 1s; }
    .float-icon:nth-child(13) { left: 92%; top: 10%; animation-duration: 21s; font-size: 3rem; animation-delay: 9s; }
    .float-icon:nth-child(14) { left: 50%; top: 85%; animation-duration: 26s; font-size: 4rem; animation-delay: 5.5s; }
    .float-icon:nth-child(15) { left: 10%; top: 45%; animation-duration: 24s; font-size: 3.5rem; animation-delay: 3.5s; }

    @keyframes floatIcon {
      0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
      10% { opacity: 0.6; }
      50% { transform: translate(80px, -180px) rotate(180deg) scale(1.3); opacity: 0.8; }
      90% { opacity: 0.6; }
      100% { transform: translate(-60px, -700px) rotate(360deg) scale(0.8); opacity: 0; }
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    .star:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
    .star:nth-child(2) { left: 20%; top: 40%; animation-delay: 0.5s; width: 2px; height: 2px; }
    .star:nth-child(3) { left: 30%; top: 10%; animation-delay: 1s; }
    .star:nth-child(4) { left: 40%; top: 60%; animation-delay: 1.5s; width: 4px; height: 4px; }
    .star:nth-child(5) { left: 50%; top: 25%; animation-delay: 2s; }
    .star:nth-child(6) { left: 60%; top: 70%; animation-delay: 2.5s; width: 2px; height: 2px; }
    .star:nth-child(7) { left: 70%; top: 15%; animation-delay: 3s; }
    .star:nth-child(8) { left: 80%; top: 50%; animation-delay: 0.3s; width: 4px; height: 4px; }
    .star:nth-child(9) { left: 90%; top: 30%; animation-delay: 1.8s; }
    .star:nth-child(10) { left: 15%; top: 80%; animation-delay: 2.2s; width: 2px; height: 2px; }
    .star:nth-child(11) { left: 45%; top: 90%; animation-delay: 3.5s; }
    .star:nth-child(12) { left: 75%; top: 85%; animation-delay: 0.7s; width: 3px; height: 3px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .shooting-star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.3);
      animation: shoot 6s linear infinite;
    }
    .shooting-star:nth-child(13) { left: 10%; top: 10%; animation-delay: 0s; }
    .shooting-star:nth-child(14) { left: 30%; top: 5%; animation-delay: 3s; width: 3px; height: 3px; }
    .shooting-star:nth-child(15) { left: 60%; top: 15%; animation-delay: 5s; }
    .shooting-star:nth-child(16) { left: 80%; top: 8%; animation-delay: 1.5s; width: 2px; height: 2px; }

    @keyframes shoot {
      0% { transform: translate(0, 0) rotate(45deg); opacity: 0; }
      5% { opacity: 1; }
      20% { transform: translate(-200px, 200px) rotate(45deg); opacity: 1; }
      25% { opacity: 0; }
      100% { opacity: 0; }
    }

    .education-ribbon {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      z-index: 10;
      background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd, #ff6b6b);
      background-size: 300% 100%;
      animation: gradientMove 4s linear infinite;
      box-shadow: 0 2px 20px rgba(13, 110, 253, 0.3);
    }
    @keyframes gradientMove {
      0% { background-position: 0% 0%; }
      100% { background-position: 300% 0%; }
    }

    /* ----- CONTAINER (reusable) ----- */
    .container {
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 0 1rem;
      position: relative;
      z-index: 1;
    }

    /* ----- HEADER (glassmorphism) ----- */
    .header {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 12px 0;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: 100%;
      margin-bottom: 2.5rem;
      border-radius: 60px;
      animation: headerSlide 0.8s ease-out 0.3s both;
    }
    @keyframes headerSlide {
      0% { opacity: 0; transform: translateY(-30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .header-inner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem 1.5rem;
      padding: 0 20px;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      background: linear-gradient(135deg, #48dbfb, #5f27cd);
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 6px 20px rgba(72, 219, 251, 0.3);
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: -0.5px;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }
    .logo-text span {
      color: #48dbfb;
      font-weight: 300;
    }

    /* navigation */
    .nav-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 10px;
      align-items: center;
    }

    .nav-tabs a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.7);
      font-weight: 500;
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 40px;
      transition: 0.25s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      background: transparent;
    }

    .nav-tabs a i {
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      transition: 0.2s;
    }

    .nav-tabs a:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transform: translateY(-2px);
    }

    .nav-tabs a.active {
      background: linear-gradient(135deg, #48dbfb, #5f27cd);
      color: white;
      box-shadow: 0 4px 20px rgba(72, 219, 251, 0.3);
    }
    .nav-tabs a.active i {
      color: white;
    }

    /* ----- FORM CARD (glassmorphism) ----- */
    .form-card {
      max-width: 840px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      border-radius: 48px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      z-index: 1;
      animation: dashboardSlide 0.8s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes dashboardSlide {
      0% { transform: translateY(40px) scale(0.95); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    .form-card:hover {
      border-color: rgba(72, 219, 251, 0.2);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
    }

    .form-header {
      background: linear-gradient(135deg, #0a0e27, #1a1a4e, #2d1b69);
      padding: 2rem 2.5rem 1.8rem;
      color: white;
      position: relative;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .form-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #48dbfb, #5f27cd, #48dbfb, #5f27cd);
      background-size: 200% 100%;
      animation: shimmer 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 0%; }
      100% { background-position: 0% 0%; }
    }

    .form-header h1 {
      font-size: 2.2rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: white;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    .form-header h1 i {
      color: #48dbfb;
      font-size: 2rem;
      filter: drop-shadow(0 2px 8px rgba(72, 219, 251, 0.3));
    }

    .form-header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      opacity: 0.85;
      font-weight: 300;
      letter-spacing: 0.3px;
      max-width: 80%;
      color: rgba(255, 255, 255, 0.9);
    }

    .form-header p strong {
      color: #48dbfb;
      font-weight: 600;
    }

    .form-body {
      padding: 2.5rem 2.5rem 2.8rem;
    }

    /* ----- GRID & INPUTS (glassmorphism) ----- */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem 2rem;
    }

    .full-width {
      grid-column: 1 / -1;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .input-group label {
      font-weight: 500;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.9);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .input-group label i {
      color: #48dbfb;
      width: 1.2rem;
      font-size: 1rem;
    }

    .input-group label .required {
      color: #ff6b6b;
      font-weight: 600;
      margin-left: 2px;
    }

    .input-group input,
    .input-group select,
    .input-group textarea {
      width: 100%;
      padding: 0.7rem 1rem;
      border: 1.5px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.06);
      transition: all 0.25s ease;
      color: white;
      outline: none;
    }

    .input-group input::placeholder,
    .input-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
    }

    .input-group input:focus,
    .input-group select:focus,
    .input-group textarea:focus {
      border-color: #48dbfb;
      background: rgba(72, 219, 251, 0.08);
      box-shadow: 0 0 0 5px rgba(72, 219, 251, 0.08);
    }

    .input-group select option {
      background: #1a1a4e;
      color: white;
    }

    .input-group textarea {
      resize: vertical;
      min-height: 110px;
      border-radius: 20px;
    }

    .input-group .hint {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: 0.2rem;
      padding-left: 0.3rem;
    }

    .inline-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1.8rem;
      padding-top: 0.3rem;
    }

    .inline-group .radio-option {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.85);
      cursor: pointer;
    }

    .inline-group .radio-option input[type="radio"] {
      appearance: none;
      width: 1.1rem;
      height: 1.1rem;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      outline: none;
      transition: 0.15s;
      cursor: pointer;
      position: relative;
      background: rgba(255, 255, 255, 0.06);
    }

    .inline-group .radio-option input[type="radio"]:checked {
      border-color: #48dbfb;
      background: #48dbfb;
    }

    .inline-group .radio-option input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0.4rem;
      height: 0.4rem;
      background: white;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .inline-group .radio-option input[type="radio"]:focus-visible {
      outline: 2px solid #48dbfb;
    }

    .checkbox-group {
      display: flex;
      align-items: flex-start;
      gap: 0.8rem;
      margin-top: 0.4rem;
    }

    .checkbox-group input[type="checkbox"] {
      width: 1.2rem;
      height: 1.2rem;
      accent-color: #48dbfb;
      margin-top: 0.15rem;
      border-radius: 6px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.06);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
    }

    .checkbox-group label {
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.8);
      line-height: 1.4;
    }

    .checkbox-group label a {
      color: #48dbfb;
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px dotted #48dbfb;
    }

    .checkbox-group label a:hover {
      border-bottom: 2px solid #48dbfb;
    }

    .btn-submit {
      background: linear-gradient(135deg, #48dbfb, #5f27cd);
      color: white;
      border: none;
      padding: 1rem 2.2rem;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 60px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 1.2rem;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 28px -6px rgba(72, 219, 251, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-submit i {
      font-size: 1.2rem;
      transition: transform 0.3s ease;
    }

    .btn-submit:hover {
      transform: scale(1.02);
      box-shadow: 0 12px 36px -8px rgba(72, 219, 251, 0.4);
    }

    .btn-submit:hover i {
      transform: translateX(6px) scale(1.05);
    }

    .btn-submit:active {
      transform: scale(0.97);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.8rem 1.8rem;
      font-size: 0.95rem;
      font-weight: 500;
      border-radius: 60px;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-4px);
      color: white;
    }

    .form-footer {
      margin-top: 2rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 1.5rem;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.4);
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      flex-wrap: wrap;
    }

    .form-footer i {
      color: #48dbfb;
      margin-right: 4px;
    }

    .form-footer span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .action-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    /* ----- RESPONSIVE ----- */
    @media (max-width: 820px) {
      .header-inner {
        flex-direction: column;
        align-items: stretch;
      }
      .nav-tabs {
        justify-content: center;
        gap: 4px 8px;
      }
      .nav-tabs a {
        font-size: 0.8rem;
        padding: 4px 10px;
      }
      .float-icon {
        font-size: 1.5rem !important;
      }
      .orb {
        width: 200px !important;
        height: 200px !important;
      }
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
      .form-header {
        padding: 1.5rem;
      }
      .form-header h1 {
        font-size: 1.8rem;
      }
      .form-header p {
        max-width: 100%;
        font-size: 0.95rem;
      }
      .form-body {
        padding: 1.8rem;
      }
      .inline-group {
        gap: 0.4rem 1rem;
      }
      .btn-submit {
        padding: 0.9rem 1.5rem;
        font-size: 1rem;
      }
      .action-buttons {
        flex-direction: column;
      }
    }

    @media (max-width: 480px) {
      .form-header h1 {
        font-size: 1.5rem;
        flex-wrap: wrap;
      }
      .form-header h1 i {
        font-size: 1.5rem;
      }
      .form-body {
        padding: 1.2rem;
      }
      .input-group input,
      .input-group select,
      .input-group textarea {
        padding: 0.6rem 0.9rem;
        font-size: 0.9rem;
      }
      .nav-tabs a {
        font-size: 0.7rem;
        padding: 4px 8px;
      }
      .logo-text {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

<!-- ===== ANIMATED BACKGROUND ===== -->
<div class="bg-animation">
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="float-icon"><i class="fas fa-graduation-cap"></i></div>
  <div class="float-icon"><i class="fas fa-book-open"></i></div>
  <div class="float-icon"><i class="fas fa-flask"></i></div>
  <div class="float-icon"><i class="fas fa-microscope"></i></div>
  <div class="float-icon"><i class="fas fa-dna"></i></div>
  <div class="float-icon"><i class="fas fa-atom"></i></div>
  <div class="float-icon"><i class="fas fa-pencil-alt"></i></div>
  <div class="float-icon"><i class="fas fa-calculator"></i></div>
  <div class="float-icon"><i class="fas fa-globe-americas"></i></div>
  <div class="float-icon"><i class="fas fa-certificate"></i></div>
  <div class="float-icon"><i class="fas fa-university"></i></div>
  <div class="float-icon"><i class="fas fa-chalkboard-teacher"></i></div>
  <div class="stars">
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div>
    <div class="star"></div><div class="star"></div><div class="star"></div>
  </div>
  <div class="shooting-star"></div><div class="shooting-star"></div>
  <div class="shooting-star"></div><div class="shooting-star"></div>
</div>

<div class="education-ribbon"></div>

<!-- ===== HEADER ===== -->
<header class="header">
  <div class="container header-inner">
    <div class="logo-area">
      <div class="logo-icon"><i class="fas fa-graduation-cap"></i></div>
      <div class="logo-text">Brightwood<span>Academy</span></div>
    </div>
    <nav class="nav-tabs">
      <a href="/admin/home"><i class="fas fa-home"></i> Home</a>
      <a href="/admin/academic"><i class="fas fa-book-open"></i> Academic</a>
      <a href="/admin/campus"><i class="fas fa-tree"></i> Campus</a>
      <a href="/admin/addStudent"><i class="fas fa-user-plus"></i> Add Student</a>
      <a href="/admin/addTeacher"><i class="fas fa-chalkboard-teacher"></i> Add Teacher</a>
      <a href="/admin/contact"><i class="fas fa-phone-alt"></i> Contact</a>
      <a href="/admin/admission" class="active"><i class="fas fa-door-open"></i> Admission</a>
      <a href="/admin/enquiry"><i class="fas fa-question-circle"></i> Enquiry</a>
    </nav>
  </div>
</header>

<!-- ===== UPDATE ADMISSION FORM CARD ===== -->
<div class="form-card">
  <!-- header -->
  <div class="form-header">
    <h1>
      <i class="fas fa-edit"></i>
      Update Admission
    </h1>
    <p><i class="fas fa-chevron-right" style="font-size: 0.7rem; opacity: 0.7;"></i> Update admission details for
      <strong th:text="${admissionFound.studentName}">Student Name</strong></p>
  </div>

  <!-- form body -->
  <div class="form-body">
    <form id="admissionForm" method="post" action="/userUpdateSubmitAdmissionForm">
      <!-- Hidden ID field - CRITICAL for update -->
      <input type="hidden" name="id" th:value="${admissionFound.id}">

      <div class="form-grid">

        <!-- === Student's full name === -->
        <div class="input-group full-width">
          <label for="studentName"><i class="fas fa-user-graduate"></i> Student's full name <span class="required">*</span></label>
          <input type="text" name="studentName" id="studentName"
                 th:value="${admissionFound.studentName}"
                 placeholder="e.g. Aarav Kumar" required>
        </div>

        <!-- Date of birth -->
        <div class="input-group">
          <label for="dob"><i class="fas fa-calendar-alt"></i> Date of birth <span class="required">*</span></label>
          <input type="date" name="dateOfBirth" id="dob"
                 th:value="${admissionFound.dateOfBirth}" required>
        </div>

        <!-- Gender -->
        <div class="input-group">
          <label><i class="fas fa-venus-mars"></i> Gender <span class="required">*</span></label>
          <div class="inline-group" style="padding-top: 0.2rem;">
            <label class="radio-option">
              <input type="radio" name="gender" value="male"
                     th:checked="${admissionFound.gender == 'male'}"> Male
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="female"
                     th:checked="${admissionFound.gender == 'female'}"> Female
            </label>
            <label class="radio-option">
              <input type="radio" name="gender" value="other"
                     th:checked="${admissionFound.gender == 'other'}"> Other
            </label>
          </div>
        </div>

        <!-- Nationality -->
        <div class="input-group">
          <label for="nationality"><i class="fas fa-flag"></i> Nationality</label>
          <input type="text" name="nationality" id="nationality"
                 th:value="${admissionFound.nationality}"
                 placeholder="e.g. Indian">
        </div>

        <!-- Grade applying for -->
        <div class="input-group">
          <label for="grade"><i class="fas fa-graduation-cap"></i> Grade applying for <span class="required">*</span></label>
          <select name="grade" id="grade" required>
            <option value="pre_k" th:selected="${admissionFound.grade == 'pre_k'}">Pre-K (Nursery)</option>
            <option value="lkg" th:selected="${admissionFound.grade == 'lkg'}">Kindergarten (LKG)</option>
            <option value="ukg" th:selected="${admissionFound.grade == 'ukg'}">Kindergarten (UKG)</option>
            <option value="grade_1" th:selected="${admissionFound.grade == 'grade_1'}">Grade 1</option>
            <option value="grade_2" th:selected="${admissionFound.grade == 'grade_2'}">Grade 2</option>
            <option value="grade_3" th:selected="${admissionFound.grade == 'grade_3'}">Grade 3</option>
            <option value="grade_4" th:selected="${admissionFound.grade == 'grade_4'}">Grade 4</option>
            <option value="grade_5" th:selected="${admissionFound.grade == 'grade_5'}">Grade 5</option>
            <option value="grade_6" th:selected="${admissionFound.grade == 'grade_6'}">Grade 6</option>
            <option value="grade_7" th:selected="${admissionFound.grade == 'grade_7'}">Grade 7</option>
            <option value="grade_8" th:selected="${admissionFound.grade == 'grade_8'}">Grade 8</option>
            <option value="grade_9" th:selected="${admissionFound.grade == 'grade_9'}">Grade 9</option>
            <option value="grade_10" th:selected="${admissionFound.grade == 'grade_10'}">Grade 10</option>
            <option value="grade_11" th:selected="${admissionFound.grade == 'grade_11'}">Grade 11</option>
            <option value="grade_12" th:selected="${admissionFound.grade == 'grade_12'}">Grade 12</option>
          </select>
        </div>

        <!-- Academic year -->
        <div class="input-group">
          <label for="academicYear"><i class="fas fa-calendar-check"></i> Academic year <span class="required">*</span></label>
          <select name="academicYear" id="academicYear" required>
            <option value="year_2026_27" th:selected="${admissionFound.academicYear == 'year_2026_27'}">2026–2027</option>
            <option value="year_2027_28" th:selected="${admissionFound.academicYear == 'year_2027_28'}">2027–2028</option>
            <option value="year_2028_29" th:selected="${admissionFound.academicYear == 'year_2028_29'}">2028–2029</option>
          </select>
        </div>

        <!-- === Parent / Guardian section (full width) === -->
        <div class="input-group full-width" style="margin-top: 0.2rem;">
          <label style="font-weight: 600; font-size: 1rem; color: rgba(255,255,255,0.95); border-bottom: 2px solid rgba(255,255,255,0.08); padding-bottom: 0.3rem; width: 100%;">
            <i class="fas fa-users"></i> Parent / Guardian details
          </label>
        </div>

        <!-- Parent name -->
        <div class="input-group">
          <label for="parentName"><i class="fas fa-user"></i> Full name <span class="required">*</span></label>
          <input type="text" name="parentName" id="parentName"
                 th:value="${admissionFound.parentName}"
                 placeholder="e.g. Rajesh Kumar" required>
        </div>

        <!-- Relationship -->
        <div class="input-group">
          <label for="relationship"><i class="fas fa-user-friends"></i> Relationship <span class="required">*</span></label>
          <select name="relationShip" id="relationship" required>
            <option value="father" th:selected="${admissionFound.relationShip == 'father'}">Father</option>
            <option value="mother" th:selected="${admissionFound.relationShip == 'mother'}">Mother</option>
            <option value="guardian" th:selected="${admissionFound.relationShip == 'guardian'}">Guardian</option>
            <option value="other" th:selected="${admissionFound.relationShip == 'other'}">Other</option>
          </select>
        </div>

        <!-- Parent email -->
        <div class="input-group">
          <label for="parentEmail"><i class="fas fa-envelope"></i> Email address <span class="required">*</span></label>
          <input type="email" name="parentEmailId" id="parentEmail"
                 th:value="${admissionFound.parentEmailId}"
                 placeholder="parent@example.com" required>
        </div>

        <!-- Parent phone -->
        <div class="input-group">
          <label for="parentPhone"><i class="fas fa-phone-alt"></i> Phone number <span class="required">*</span></label>
          <input type="tel" name="parentPhoneNumber" id="parentPhone"
                 th:value="${admissionFound.parentPhoneNumber}"
                 placeholder="+91 98765 43210" maxlength="10" required>
        </div>

        <!-- Address -->
        <div class="input-group full-width">
          <label for="address"><i class="fas fa-home"></i> Residential address</label>
          <input type="text" name="address" id="address"
                 th:value="${admissionFound.address}"
                 placeholder="Street, city, state, pincode">
        </div>

        <!-- Previous school (optional) -->
        <div class="input-group full-width">
          <label for="prevSchool"><i class="fas fa-school"></i> Previous school (if any)</label>
          <input type="text" name="previousSchool" id="prevSchool"
                 th:value="${admissionFound.previousSchool}"
                 placeholder="Name of previous school">
        </div>

        <!-- Additional message -->
        <div class="input-group full-width">
          <label for="message"><i class="fas fa-pencil-alt"></i> Additional notes / questions</label>
          <textarea id="message" name="additionalMessage"
                    placeholder="Any special requests, medical conditions, or comments…"
                    th:text="${admissionFound.additionalMessage}"></textarea>
          <span class="hint"><i class="far fa-comment-dots"></i> We'll keep this confidential.</span>
        </div>

      </div> <!-- end grid -->

      <!-- Action Buttons -->
      <div class="action-buttons">
        <button type="submit" class="btn-submit">
          <span>Update Admission</span>
          <i class="fas fa-arrow-right"></i>
        </button>
        <a href="/user/admission" class="btn-back">
          <i class="fas fa-arrow-left"></i> Back to Admissions
        </a>
      </div>

      <div class="form-footer">
        <span><i class="fas fa-lock"></i> Secure & encrypted</span>
        <span><i class="fas fa-clock"></i> Changes saved immediately</span>
        <span><i class="fas fa-phone"></i> +91 8789139235</span>
      </div>
    </form>
  </div>
</div>

</body>
</html>
