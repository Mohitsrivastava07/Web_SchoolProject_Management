<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · Brightwood Academy</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        /* Reset & Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            background: #0a0e27;
        }

        /* ===== ANIMATED BACKGROUND (same as dashboard) ===== */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            background: linear-gradient(135deg, #0a0e27, #1a1a4e, #2d1b69);
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: orbFloat 20s ease-in-out infinite;
        }
        .orb:nth-child(1) {
            width: 400px;
            height: 400px;
            background: rgba(13, 110, 253, 0.3);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }
        .orb:nth-child(2) {
            width: 500px;
            height: 500px;
            background: rgba(102, 16, 242, 0.25);
            bottom: -150px;
            right: -150px;
            animation-delay: -5s;
        }
        .orb:nth-child(3) {
            width: 300px;
            height: 300px;
            background: rgba(255, 107, 107, 0.15);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -10s;
        }

        @keyframes orbFloat {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(50px, -50px) scale(1.1); }
            50% { transform: translate(-30px, 30px) scale(0.9); }
            75% { transform: translate(30px, 50px) scale(1.05); }
        }

        .float-icon {
            position: absolute;
            color: rgba(255, 255, 255, 0.06);
            animation: floatIcon 25s linear infinite;
            text-shadow: 0 0 20px rgba(13, 110, 253, 0.1);
        }
        .float-icon:nth-child(4) { left: 5%; top: 10%; animation-duration: 28s; font-size: 4rem; animation-delay: 0s; }
        .float-icon:nth-child(5) { left: 15%; top: 60%; animation-duration: 22s; font-size: 3rem; animation-delay: 3s; }
        .float-icon:nth-child(6) { left: 25%; top: 30%; animation-duration: 30s; font-size: 5rem; animation-delay: 6s; }
        .float-icon:nth-child(7) { left: 35%; top: 75%; animation-duration: 24s; font-size: 3.5rem; animation-delay: 2s; }
        .float-icon:nth-child(8) { left: 45%; top: 15%; animation-duration: 26s; font-size: 4.5rem; animation-delay: 5s; }
        .float-icon:nth-child(9) { left: 55%; top: 55%; animation-duration: 23s; font-size: 3rem; animation-delay: 8s; }
        .float-icon:nth-child(10) { left: 65%; top: 25%; animation-duration: 29s; font-size: 4rem; animation-delay: 4s; }
        .float-icon:nth-child(11) { left: 75%; top: 70%; animation-duration: 25s; font-size: 3.5rem; animation-delay: 7s; }
        .float-icon:nth-child(12) { left: 85%; top: 40%; animation-duration: 27s; font-size: 4.5rem; animation-delay: 1s; }
        .float-icon:nth-child(13) { left: 92%; top: 10%; animation-duration: 21s; font-size: 3rem; animation-delay: 9s; }
        .float-icon:nth-child(14) { left: 50%; top: 85%; animation-duration: 26s; font-size: 4rem; animation-delay: 5.5s; }
        .float-icon:nth-child(15) { left: 10%; top: 45%; animation-duration: 24s; font-size: 3.5rem; animation-delay: 3.5s; }

        @keyframes floatIcon {
            0% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.6; }
            50% { transform: translate(80px, -180px) rotate(180deg) scale(1.3); opacity: 0.8; }
            90% { opacity: 0.6; }
            100% { transform: translate(-60px, -700px) rotate(360deg) scale(0.8); opacity: 0; }
        }

        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            animation: twinkle 3s ease-in-out infinite;
        }
        .star:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
        .star:nth-child(2) { left: 20%; top: 40%; animation-delay: 0.5s; width: 2px; height: 2px; }
        .star:nth-child(3) { left: 30%; top: 10%; animation-delay: 1s; }
        .star:nth-child(4) { left: 40%; top: 60%; animation-delay: 1.5s; width: 4px; height: 4px; }
        .star:nth-child(5) { left: 50%; top: 25%; animation-delay: 2s; }
        .star:nth-child(6) { left: 60%; top: 70%; animation-delay: 2.5s; width: 2px; height: 2px; }
        .star:nth-child(7) { left: 70%; top: 15%; animation-delay: 3s; }
        .star:nth-child(8) { left: 80%; top: 50%; animation-delay: 0.3s; width: 4px; height: 4px; }
        .star:nth-child(9) { left: 90%; top: 30%; animation-delay: 1.8s; }
        .star:nth-child(10) { left: 15%; top: 80%; animation-delay: 2.2s; width: 2px; height: 2px; }
        .star:nth-child(11) { left: 45%; top: 90%; animation-delay: 3.5s; }
        .star:nth-child(12) { left: 75%; top: 85%; animation-delay: 0.7s; width: 3px; height: 3px; }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .shooting-star {
            position: absolute;
            width: 2px;
            height: 2px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255, 255, 255, 0.3);
            animation: shoot 6s linear infinite;
        }
        .shooting-star:nth-child(13) { left: 10%; top: 10%; animation-delay: 0s; }
        .shooting-star:nth-child(14) { left: 30%; top: 5%; animation-delay: 3s; width: 3px; height: 3px; }
        .shooting-star:nth-child(15) { left: 60%; top: 15%; animation-delay: 5s; }
        .shooting-star:nth-child(16) { left: 80%; top: 8%; animation-delay: 1.5s; width: 2px; height: 2px; }

        @keyframes shoot {
            0% { transform: translate(0, 0) rotate(45deg); opacity: 0; }
            5% { opacity: 1; }
            20% { transform: translate(-200px, 200px) rotate(45deg); opacity: 1; }
            25% { opacity: 0; }
            100% { opacity: 0; }
        }

        .education-ribbon {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            z-index: 10;
            background: linear-gradient(90deg, #ff6b6b, #feca57, #48dbfb, #ff9ff3, #54a0ff, #5f27cd, #ff6b6b);
            background-size: 300% 100%;
            animation: gradientMove 4s linear infinite;
            box-shadow: 0 2px 20px rgba(13, 110, 253, 0.3);
        }
        @keyframes gradientMove {
            0% { background-position: 0% 0%; }
            100% { background-position: 300% 0%; }
        }

        /* Floating Particles */
        .particle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            animation: particleFloat 15s infinite;
        }

        .particle:nth-child(1) { width: 8px; height: 8px; left: 20%; animation-delay: 0s; }
        .particle:nth-child(2) { width: 12px; height: 12px; left: 40%; animation-delay: 2s; }
        .particle:nth-child(3) { width: 6px; height: 6px; left: 60%; animation-delay: 4s; }
        .particle:nth-child(4) { width: 10px; height: 10px; left: 80%; animation-delay: 1s; }
        .particle:nth-child(5) { width: 14px; height: 14px; left: 10%; animation-delay: 3s; }
        .particle:nth-child(6) { width: 7px; height: 7px; left: 70%; animation-delay: 5s; }
        .particle:nth-child(7) { width: 9px; height: 9px; left: 50%; animation-delay: 2.5s; }
        .particle:nth-child(8) { width: 11px; height: 11px; left: 30%; animation-delay: 4.5s; }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            20% {
                opacity: 0.6;
            }
            80% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-100vh) rotate(720deg);
                opacity: 0;
            }
        }

        /* Container */
        .main-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            padding: 0 15px;
        }

        /* Professional Title Animation */
        .title {
            text-align: center;
            color: white;
            margin-bottom: 15px;
            font-weight: 700;
            font-size: 2.4rem;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            animation: professionalSlide 1s cubic-bezier(0.22, 1, 0.36, 1);
            letter-spacing: 1px;
        }

        .title .fa-graduation-cap {
            display: inline-block;
            animation: capBounce 2s ease-in-out infinite;
        }

        @keyframes capBounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-5px) rotate(-5deg); }
            75% { transform: translateY(-5px) rotate(5deg); }
        }

        @keyframes professionalSlide {
            0% {
                transform: translateY(-60px) scale(0.9);
                opacity: 0;
                filter: blur(10px);
            }
            100% {
                transform: translateY(0) scale(1);
                opacity: 1;
                filter: blur(0);
            }
        }

        /* Subtitle with education theme */
        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            margin-bottom: 25px;
            font-weight: 300;
            letter-spacing: 2px;
            animation: subtitleFade 1s ease-out 0.3s both;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        @keyframes subtitleFade {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .subtitle i {
            margin: 0 5px;
            animation: iconPulse 2s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; transform: scale(1.2); }
        }

        .edu-badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: rgba(72, 219, 251, 0.15);
            color: #48dbfb;
            border: 1px solid rgba(72, 219, 251, 0.2);
            animation: badgePulse 2s ease-in-out infinite;
        }

        @keyframes badgePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); background: rgba(72, 219, 251, 0.25); }
        }

        /* Login Box with professional glass effect */
        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: boxReveal 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes boxReveal {
            0% {
                transform: perspective(600px) rotateX(-10deg) translateY(40px);
                opacity: 0;
            }
            100% {
                transform: perspective(600px) rotateX(0) translateY(0);
                opacity: 1;
            }
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            font-weight: 700;
            font-size: 1.8rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .login-box h2 i {
            margin-right: 10px;
            color: #48dbfb;
        }

        /* Professional form labels with icons ABOVE the field */
        .form-group-custom {
            margin-bottom: 25px;
            animation: inputReveal 0.6s ease-out both;
        }

        .form-group-custom:nth-child(1) { animation-delay: 0.6s; }
        .form-group-custom:nth-child(2) { animation-delay: 0.8s; }

        @keyframes inputReveal {
            0% {
                opacity: 0;
                transform: translateX(-20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Icon container above the input */
        .input-icon-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .input-icon-wrapper i {
            font-size: 1.3rem;
            color: #48dbfb;
            background: rgba(72, 219, 251, 0.1);
            padding: 8px;
            border-radius: 10px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .input-icon-wrapper .label-text {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
            transition: color 0.3s ease;
        }

        /* Hover effect on the icon */
        .form-group-custom:hover .input-icon-wrapper i {
            background: rgba(72, 219, 251, 0.2);
            transform: scale(1.05) rotate(-5deg);
            color: #5f27cd;
        }

        .form-group-custom:hover .input-icon-wrapper .label-text {
            color: #48dbfb;
        }

        /* Form inputs */
        .form-control {
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.12);
            padding: 13px 16px;
            font-size: 0.95rem;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            background: rgba(255, 255, 255, 0.06);
            color: white;
            height: 52px;
            width: 100%;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .form-control:focus {
            border-color: #48dbfb;
            box-shadow: 0 0 0 4px rgba(72, 219, 251, 0.15);
            transform: translateY(-2px);
            background: rgba(72, 219, 251, 0.06);
            color: white;
        }

        .form-control:hover {
            border-color: rgba(72, 219, 251, 0.3);
            background: rgba(255, 255, 255, 0.08);
        }

        /* Progress bar under input */
        .input-progress {
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, #48dbfb, #5f27cd);
            border-radius: 0 0 12px 12px;
            transition: width 0.5s ease;
            margin-top: 0px;
        }

        .form-control:focus ~ .input-progress {
            width: 100%;
        }

        /* Professional Login Button */
        .btn-login {
            width: 100%;
            height: 54px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            background: linear-gradient(135deg, #48dbfb, #5f27cd);
            border: none;
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
            animation: buttonReveal 0.6s ease-out 1s both;
            margin-top: 10px;
            color: white;
            box-shadow: 0 4px 20px rgba(72, 219, 251, 0.3);
        }

        @keyframes buttonReveal {
            0% {
                opacity: 0;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .btn-login::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s ease;
        }

        .btn-login:hover::before {
            left: 100%;
        }

        .btn-login:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 12px 35px rgba(72, 219, 251, 0.4);
        }

        .btn-login:active {
            transform: scale(0.96);
        }

        .btn-login i {
            margin-right: 10px;
            transition: transform 0.3s ease;
        }

        .btn-login:hover i {
            transform: translateX(5px) rotate(-5deg);
        }

        /* Ripple effect on button click */
        .ripple-effect {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple 0.6s ease-out;
            pointer-events: none;
        }

        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* Sign up link with professional style */
        .signup-link {
            text-align: center;
            margin-top: 22px;
            animation: linkReveal 0.6s ease-out 1.2s both;
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes linkReveal {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .signup-link a {
            color: #48dbfb;
            font-weight: 700;
            text-decoration: none;
            position: relative;
            transition: all 0.3s ease;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .signup-link a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, #48dbfb, #5f27cd);
            transition: width 0.4s ease;
        }

        .signup-link a:hover {
            color: #5f27cd;
            background: rgba(72, 219, 251, 0.1);
        }

        .signup-link a:hover::before {
            width: 100%;
        }

        .signup-link i {
            margin: 0 5px;
            font-size: 0.85rem;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .login-box {
                padding: 30px 20px;
            }
            .title {
                font-size: 1.8rem;
            }
            .login-box h2 {
                font-size: 1.4rem;
            }
            .float-icon {
                font-size: 1.5rem !important;
            }
            .orb {
                width: 200px !important;
                height: 200px !important;
            }
            .form-control {
                padding: 11px 14px;
                height: 46px;
                font-size: 0.9rem;
            }
            .btn-login {
                height: 48px;
                font-size: 1rem;
            }
            .input-icon-wrapper i {
                width: 34px;
                height: 34px;
                font-size: 1.1rem;
            }
            .input-icon-wrapper .label-text {
                font-size: 0.85rem;
            }
        }
    </style>

</head>
<body>

<!-- ===== ANIMATED BACKGROUND (same as dashboard) ===== -->
<div class="bg-animation">
    <div class="orb"></div><div class="orb"></div><div class="orb"></div>
    <div class="float-icon"><i class="fas fa-graduation-cap"></i></div>
    <div class="float-icon"><i class="fas fa-book-open"></i></div>
    <div class="float-icon"><i class="fas fa-flask"></i></div>
    <div class="float-icon"><i class="fas fa-microscope"></i></div>
    <div class="float-icon"><i class="fas fa-dna"></i></div>
    <div class="float-icon"><i class="fas fa-atom"></i></div>
    <div class="float-icon"><i class="fas fa-pencil-alt"></i></div>
    <div class="float-icon"><i class="fas fa-calculator"></i></div>
    <div class="float-icon"><i class="fas fa-globe-americas"></i></div>
    <div class="float-icon"><i class="fas fa-certificate"></i></div>
    <div class="float-icon"><i class="fas fa-university"></i></div>
    <div class="float-icon"><i class="fas fa-chalkboard-teacher"></i></div>
    <div class="stars">
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
        <div class="star"></div><div class="star"></div><div class="star"></div>
    </div>
    <div class="shooting-star"></div><div class="shooting-star"></div>
    <div class="shooting-star"></div><div class="shooting-star"></div>
</div>

<!-- Education Ribbon -->
<div class="education-ribbon"></div>

<!-- Floating Particles -->
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>
<div class="particle"></div>

<div class="main-container">

    <h2 class="title">
        <i class="fas fa-graduation-cap"></i>
        BrightwoodAcademy
    </h2>

    <div class="subtitle">
        <i class="fas fa-arrow-right"></i>
        <span class="edu-badge">excellence in education</span>
        <i class="fas fa-arrow-left"></i>
    </div>

    <div class="login-box">

        <h2>
            <i class="fas fa-user-graduate"></i>
            Welcome Back
        </h2>

        <form action="/login" method="post">

            <!-- Username Field -->
            <div class="form-group-custom">
                <div class="input-icon-wrapper">
                    <i class="fas fa-user-circle"></i>
                    <span class="label-text">Username</span>
                </div>
                <input type="text"
                       class="form-control"
                       name="username"
                       placeholder="Enter your username"
                       required>
                <div class="input-progress"></div>
            </div>

            <!-- Password Field -->
            <div class="form-group-custom">
                <div class="input-icon-wrapper">
                    <i class="fas fa-lock"></i>
                    <span class="label-text">Password</span>
                </div>
                <input type="password"
                       class="form-control"
                       name="password"
                       placeholder="Enter your password"
                       required>
                <div class="input-progress"></div>
            </div>

            <button type="submit" class="btn btn-login" id="loginBtn">
                <i class="fas fa-rocket"></i>
                Login
            </button>

            <div class="signup-link">
                <i class="fas fa-edit"></i>
                New to BrightwoodAcademy!
                <a href="/register">
                    Create Account <i class="fas fa-arrow-right"></i>
                </a>
            </div>

        </form>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Button Ripple Effect -->
<script>
    document.getElementById('loginBtn').addEventListener('click', function(e) {
        const rect = this.getBoundingClientRect();
        const ripple = document.createElement('span');
        const size = Math.max(rect.width, rect.height);
        const x = e.clientX - rect.left - size/2;
        const y = e.clientY - rect.top - size/2;

        ripple.style.width = ripple.style.height = size + 'px';
        ripple.style.left = x + 'px';
        ripple.style.top = y + 'px';
        ripple.classList.add('ripple-effect');

        this.appendChild(ripple);

        setTimeout(() => {
            ripple.remove();
        }, 600);
    });
</script>
