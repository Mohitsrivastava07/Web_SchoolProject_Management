spring.application.name=SchoolProject
server.port = 8080

# Use environment variables or defaults
spring.datasource.url = ${DB_URL:jdbc:postgresql://localhost:5432/schoolproject}
spring.datasource.username = ${DB_USERNAME:postgres}
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto = ${DDL_AUTO:update}
spring.jpa.show-sql = ${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQ_SIZE:10MB}
spring.servlet.multipart.file-size-threshold=${THRESHOLD:2MB}

# Activate local profile by default
spring.profiles.active=${ACTIVE_PROFILE:local}

spring.mvc.validation.enabled=false
spring.boot.validation.enabled=false